apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-notifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-notifier
  template:
    metadata:
      labels:
        app: log-notifier
    spec:
      containers:
      - name: notifier-container
        image: log-notifier:latest
        ports:
        - containerPort: 50051
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 50051
        readinessProbe:
          tcpSocket:
            port: 50051
