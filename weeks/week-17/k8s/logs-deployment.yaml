apiVersion: apps/v1
kind: Deployment
metadata:
  name: logs-svc-s05
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logs-svc-s05
  template:
    metadata:
      labels:
        app: logs-svc-s05
    spec:
      containers:
      - name: logs-container
        image: logs-svc-s05:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
