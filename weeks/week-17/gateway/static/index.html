<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>logs-s05</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #eef2f5;
            color: #1a1a1a;
            padding: 30px 20px;
        }

        .page {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Хедер простой */
        .hero {
            background: white;
            padding: 20px 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #d4dce6;
        }

        .hero h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #111;
        }

        .eyebrow {
            font-size: 12px;
            color: #2c6e9e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .hero-note {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e5e9f0;
        }

        .note-label {
            font-size: 12px;
            color: #6c7a8a;
        }

        .hero-note code {
            background: #eef2f5;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 13px;
        }

        .muted {
            color: #6c7a8a;
            font-size: 14px;
        }

        /* Сетка */
        .grid {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            border: 1px solid #d4dce6;
            border-radius: 8px;
            padding: 20px 22px;
            flex: 1;
            min-width: 250px;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 18px;
            color: #111;
        }

        /* Форма */
        .form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #2c3e4e;
        }

        input, select {
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: white;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4a7c9c;
        }

        button {
            background: #2c6e9e;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        button.secondary {
            background: #e2e8f0;
            color: #1a2a3a;
        }

        button.secondary:hover {
            background: #cbd5e1;
        }

        button:hover {
            background: #1f557a;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-head h2 {
            margin-bottom: 0;
        }

        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #2c6e9e;
        }

        /* Списки */
        .summary-list, .log-list {
            list-style: none;
        }

        .summary-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #edf2f7;
        }

        .log-list li {
            padding: 14px 0;
            border-bottom: 1px solid #edf2f7;
        }

        .log-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .log-message {
            font-size: 14px;
            color: #2d3a48;
            line-height: 1.4;
        }

        /* Пиллы */
        .pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .pill-info {
            background: #dceaf5;
            color: #1f557a;
        }

        .pill-warning {
            background: #fef0cf;
            color: #9b6f0b;
        }

        .pill-error {
            background: #fce4e4;
            color: #b13e3e;
        }

        /* Сводка */
        .summary-total {
            background: #f5f8fa;
            padding: 14px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 18px;
            border: 1px solid #e0e8f0;
        }

        .summary-number {
            font-size: 38px;
            font-weight: 700;
            color: #2c6e9e;
        }

        .level-name {
            font-weight: 500;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .grid {
                flex-direction: column;
            }
            .section-head {
                flex-wrap: wrap;
            }
            body {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="hero">
            <div>
                <div class="eyebrow">logs-s05</div>
                <h1>Панель логов</h1>
                <p class="muted">Просмотр и добавление записей</p>
            </div>
            <div class="hero-note">
                <span class="note-label">API</span>
                <code>/api/logs/</code>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>Добавить</h2>
                <form id="log-form" class="form">
                    <label>Сообщение</label>
                    <input id="message" name="message" type="text" placeholder="текст лога" required>

                    <label>Уровень</label>
                    <select id="level" name="level" required>
                        <option value="INFO">INFO</option>
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                    </select>

                    <button type="submit">Сохранить</button>
                </form>
                <p id="form-status" class="status"></p>
            </div>

            <div class="card">
                <div class="section-head">
                    <h2>Сводка</h2>
                    <button id="refresh-summary" type="button" class="secondary">Обновить</button>
                </div>
                <div id="summary">Загрузка...</div>
            </div>
        </div>

        <div class="card">
            <div class="section-head">
                <h2>Логи</h2>
                <button id="refresh-logs" type="button" class="secondary">Обновить</button>
            </div>
            <div id="logs">Загрузка...</div>
        </div>
    </div>

    <script>
        const logForm = document.getElementById("log-form");
        const logsContainer = document.getElementById("logs");
        const summaryContainer = document.getElementById("summary");
        const statusNode = document.getElementById("form-status");
        const refreshLogsButton = document.getElementById("refresh-logs");
        const refreshSummaryButton = document.getElementById("refresh-summary");

        async function fetchJson(url, options) {
            const response = await fetch(url, options);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }

        function getLevelClass(level) {
            const norm = String(level || "").toUpperCase();
            if (norm === "WARNING") return "pill pill-warning";
            if (norm === "ERROR") return "pill pill-error";
            return "pill pill-info";
        }

        function renderLogs(logs) {
            if (!logs.length) {
                logsContainer.innerHTML = '<p class="muted">Логов нет</p>';
                return;
            }
            const items = logs.map(log => `
                <li>
                    <div class="log-top">
                        <strong>#${log.id}</strong>
                        <span class="${getLevelClass(log.level)}">${log.level}</span>
                    </div>
                    <div class="log-message">${log.message}</div>
                </li>
            `).join("");
            logsContainer.innerHTML = `<ul class="log-list">${items}</ul>`;
        }

        function renderSummary(summary) {
            const entries = Object.entries(summary.by_level || {});
            const byLevel = entries.length ? `
                <ul class="summary-list">
                    ${entries.map(([level, count]) => `
                        <li>
                            <span class="level-name">${level}</span>
                            <span class="${getLevelClass(level)}">${count}</span>
                        </li>
                    `).join("")}
                </ul>
            ` : '<p class="muted">Нет данных</p>';

            summaryContainer.innerHTML = `
                <div class="summary-total">
                    <div class="muted">Всего логов</div>
                    <div class="summary-number">${summary.total ?? 0}</div>
                </div>
                ${byLevel}
            `;
        }

        async function loadLogs() {
            logsContainer.innerHTML = '<p class="muted">Загрузка...</p>';
            try {
                const logs = await fetchJson("/api/logs/");
                renderLogs(logs);
            } catch {
                logsContainer.innerHTML = '<p class="muted">Ошибка загрузки</p>';
            }
        }

        async function loadSummary() {
            summaryContainer.innerHTML = '<p class="muted">Загрузка...</p>';
            try {
                const summary = await fetchJson("/api/logs/summary");
                renderSummary(summary);
            } catch {
                summaryContainer.innerHTML = '<p class="muted">Ошибка загрузки</p>';
            }
        }

        logForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const message = document.getElementById("message").value.trim();
            const level = document.getElementById("level").value.trim();

            if (!message || !level) {
                statusNode.textContent = "Заполните поля";
                return;
            }

            statusNode.textContent = "Сохранение...";
            try {
                await fetchJson("/api/logs/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message, level })
                });
                logForm.reset();
                document.getElementById("level").value = "INFO";
                statusNode.textContent = "Готово";
                await Promise.all([loadLogs(), loadSummary()]);
            } catch {
                statusNode.textContent = "Ошибка";
            }
        });

        refreshLogsButton.addEventListener("click", loadLogs);
        refreshSummaryButton.addEventListener("click", loadSummary);
        Promise.all([loadLogs(), loadSummary()]);
    </script>
</body>
</html>
